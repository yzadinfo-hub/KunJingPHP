name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: kunjing_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, curl
          coverage: none
          tools: none

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if php -r '$p=@new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root",""); echo $p?"OK":"NO";' 2>/dev/null | grep -q OK; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready" >&2
          exit 1

      - name: Syntax check (all PHP files)
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Full regression (Phase 0~5 + Phase 7)
        run: php tests/run_all.php

      - name: Phase 6 production suite
        run: php tests/phase6.php
