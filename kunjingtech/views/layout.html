<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="keywords" content="永州堃景科技,堃景科技,企业官网,网站开发,PHP开发,小程序开发,鸿蒙开发,客服外包">
<meta name="description" content="永州堃景科技有限公司（简称堃景科技）主营电商代运营（天猫/淘宝/京东/拼多多/抖音/快手/视频号/小红书/唯品会及跨境平台）与电商客服外包，专注 WEB/PHP/H5/客户端/安卓/iOS/macOS/鸿蒙/小程序开发，提供企业官网、商城、金融、直播、小说等源码产品。">
<title>{block title}永州堃景科技有限公司 · 用代码为企业创造增长{/block}</title>
<style>
  :root{
    --primary:#5b5bd6; --primary-2:#8b5cf6; --accent:#ec4899;
    --dark:#0b1020; --ink:#1f2937; --muted:#64748b; --bg:#f6f7fb;
    --line:#e8eaf2; --radius:18px; --shadow:0 10px 30px rgba(30,27,75,.08);
    --grad:linear-gradient(120deg,#5b5bd6,#8b5cf6 55%,#ec4899);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{max-width:100%}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{display:inline-block;padding:12px 26px;border-radius:999px;font-weight:600;font-size:15px;border:none;cursor:pointer;transition:.2s;color:#fff;background:var(--grad);box-shadow:0 8px 20px rgba(91,91,214,.35)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(91,91,214,.45)}
  .btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5);box-shadow:none}
  .btn.ghost:hover{background:rgba(255,255,255,.12)}
  .btn.solid{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
  .btn.dark{background:var(--dark);color:#fff;box-shadow:var(--shadow)}

  /* ---------- 导航 ---------- */
  .nav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(160%) blur(12px);background:rgba(11,16,32,.82);border-bottom:1px solid rgba(255,255,255,.08)}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:19px;white-space:nowrap}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 6px 16px rgba(139,92,246,.5)}
  .nav .links{display:flex;gap:6px;flex-wrap:wrap}
  .nav .links a{padding:8px 14px;border-radius:10px;color:#d7dcf0;font-size:15px;transition:.18s}
  .nav .links a:hover{color:#fff;background:rgba(255,255,255,.08)}
  .nav .links a.active{color:#fff;background:rgba(139,92,246,.32)}
  .nav .cta{padding:9px 18px;font-size:14px}

  /* ---------- 区块通用 ---------- */
  section{padding:72px 0}

  /* ---------- 旗舰业务：电商代运营 ---------- */
  .agency{background:linear-gradient(135deg,#0b1020,#1a1147 58%,#2a0f4d);color:#fff;position:relative;overflow:hidden}
  .agency .sec-head h2{color:#fff}
  .agency .sec-head p{color:#b9bfe6}
  .chips-wrap{margin-bottom:26px}
  .chip-label{color:#9aa3d6;font-size:14px;font-weight:700;letter-spacing:1px;margin:0 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{display:inline-block;padding:9px 16px;border-radius:12px;font-size:15px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#e8ebfb}
  .chip.cross{background:linear-gradient(135deg,rgba(91,91,214,.32),rgba(236,72,153,.26));border-color:rgba(139,92,246,.45)}
  .sec-head{text-align:center;max-width:760px;margin:0 auto 44px}
  .kicker{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(91,91,214,.1);color:var(--primary);font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:14px}
  .sec-head h2{font-size:34px;margin:6px 0 12px;font-weight:800;letter-spacing:-.5px}
  .sec-head p{color:var(--muted);font-size:16px;margin:0}
  .grid{display:grid;gap:22px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);transition:.22s}
  .card:hover{transform:translateY(-6px);border-color:#d7d3fb}
  .card .ic{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,rgba(91,91,214,.14),rgba(236,72,153,.14));margin-bottom:16px}
  .card h3{margin:0 0 8px;font-size:19px;font-weight:700}
  .card p{margin:0;color:var(--muted);font-size:14.5px}
  .tag{display:inline-block;padding:3px 11px;border-radius:999px;background:#eef0fb;color:var(--primary);font-size:12.5px;margin:4px 6px 0 0}

  /* ---------- Hero ---------- */
  .hero{position:relative;overflow:hidden;background:radial-gradient(1200px 600px at 15% -10%,rgba(139,92,246,.55),transparent 60%),radial-gradient(900px 500px at 95% 10%,rgba(236,72,153,.4),transparent 55%),linear-gradient(135deg,#0b1020,#171347 55%,#2a1457);color:#fff;padding:104px 0 96px}
  .hero .glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
  .hero .g1{width:380px;height:380px;background:#8b5cf6;top:-120px;left:-80px}
  .hero .g2{width:340px;height:340px;background:#ec4899;bottom:-140px;right:6%}
  .hero .wrap{position:relative;z-index:2}
  .hero .badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:13.5px;margin-bottom:22px}
  .hero h1{font-size:52px;line-height:1.15;margin:0 0 18px;font-weight:800;letter-spacing:-1px}
  .hero p.lead{font-size:19px;color:#cdd2f0;max-width:640px;margin:0 0 30px}
  .hero .actions{display:flex;gap:14px;flex-wrap:wrap}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:58px;position:relative;z-index:2}
  .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px;text-align:center;backdrop-filter:blur(6px)}
  .stat .num{font-size:34px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .lab{color:#c5cae8;font-size:14px;margin-top:4px}

  /* ---------- 关于 ---------- */
  .about{background:#fff;border-radius:24px;padding:40px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .about h3{font-size:22px;margin:0 0 12px}
  .about p{color:#475569;margin:0 0 14px}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
  .pillar{background:var(--bg);border-radius:14px;padding:20px}
  .pillar b{color:var(--primary)}

  /* ---------- 优势 ---------- */
  .adv{background:linear-gradient(135deg,#0b1020,#1b1347);color:#fff;border-radius:24px;padding:48px 40px}
  .adv .sec-head h2{color:#fff}
  .adv .sec-head p{color:#b9bfe6}
  .adv .grid .card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#e8ebfb}
  .adv .grid .card p{color:#b9bfe6}
  .adv .grid .card .ic{background:linear-gradient(135deg,rgba(139,92,246,.4),rgba(236,72,153,.3))}

  /* ---------- 案例 ---------- */
  .case{position:relative;overflow:hidden;border-radius:var(--radius);padding:28px;color:#fff;min-height:200px;box-shadow:var(--shadow);background:linear-gradient(135deg,#5b5bd6,#8b5cf6)}
  .case.b{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
  .case.c{background:linear-gradient(135deg,#ec4899,#8b5cf6)}
  .case.d{background:linear-gradient(135deg,#10b981,#0ea5e9)}
  .case h3{margin:0 0 8px;font-size:20px}
  .case p{margin:0;color:rgba(255,255,255,.88);font-size:14.5px}
  .case .more{position:absolute;bottom:22px;right:24px;font-size:13px;opacity:.9}

  /* ---------- 联系 ---------- */
  .contact-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:34px;align-items:start}
  .info .row{display:flex;gap:14px;margin-bottom:18px}
  .info .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,rgba(91,91,214,.14),rgba(236,72,153,.14));display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
  .info .row b{display:block;font-size:15px}
  .info .row span{color:var(--muted);font-size:14px}
  form.box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow)}
  form.box .field{margin-bottom:16px}
  form.box label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  form.box input,form.box select,form.box textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fbfbfe;transition:.15s}
  form.box input:focus,form.box select:focus,form.box textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,91,214,.15)}
  form.box textarea{resize:vertical;min-height:120px}
  .err-tip{color:#dc2626;font-size:13px;margin-top:5px}
  .alert-ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;padding:12px 16px;border-radius:12px;margin-bottom:16px}
  .alert-err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:12px 16px;border-radius:12px;margin-bottom:16px}

  /* ---------- CTA banner ---------- */
  .cta-band{background:var(--grad);color:#fff;border-radius:24px;padding:54px 40px;text-align:center;box-shadow:0 20px 50px rgba(139,92,246,.35)}
  .cta-band h2{font-size:32px;margin:0 0 12px;font-weight:800}
  .cta-band p{color:rgba(255,255,255,.9);font-size:16px;margin:0 0 24px}

  /* ---------- 页脚 ---------- */
  footer{background:#0b1020;color:#aab0d0;padding:54px 0 26px;margin-top:0}
  footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
  footer h4{color:#fff;font-size:16px;margin:0 0 14px}
  footer a{color:#aab0d0;display:block;margin-bottom:9px;font-size:14px;transition:.15s}
  footer a:hover{color:#fff}
  footer .brand-foot{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:19px;margin-bottom:12px}
  footer .desc{font-size:14px;line-height:1.8}
  footer .copy{border-top:1px solid rgba(255,255,255,.1);margin-top:36px;padding-top:20px;text-align:center;font-size:13px;color:#7b82a8}

  /* ---------- 响应式 ---------- */
  @media (max-width:980px){
    .g3,.g4{grid-template-columns:repeat(2,1fr)}
    .contact-grid{grid-template-columns:1fr}
    .pillars{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    footer .cols{grid-template-columns:1fr 1fr}
  }
  @media (max-width:640px){
    .nav .links{display:none}
    .hero h1{font-size:34px}
    .hero{padding:72px 0 64px}
    .sec-head h2{font-size:26px}
    .g2,.g3,.g4{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    footer .cols{grid-template-columns:1fr}
    section{padding:52px 0}
  }
</style>
</head>
<body>

<div class="nav">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="logo">堃</span>
      <span>堃景科技</span>
    </a>
    <nav class="links">
      <a href="/" {if $active == 'home'}class="active"{/if}>首页</a>
      <a href="/about" {if $active == 'about'}class="active"{/if}>关于我们</a>
      <a href="/services" {if $active == 'services'}class="active"{/if}>主营业务</a>
      <a href="/products" {if $active == 'products'}class="active"{/if}>产品源码</a>
      <a href="/cases" {if $active == 'cases'}class="active"{/if}>案例展示</a>
      <a href="/contact" {if $active == 'contact'}class="active"{/if}>联系我们</a>
    </nav>
    <a class="btn cta" href="/contact">立即咨询</a>
  </div>
</div>

<main>
{block content}<!-- 页面内容 -->{/block}
</main>

{include 'partials/footer'}

</body>
</html>
