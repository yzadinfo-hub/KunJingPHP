{extend 'layout'}
{block title}{if $supplier}编辑{else}新增{/if}供应商 - 组梦ERP{/block}
{block content}
<h2>{if $supplier}编辑供应商{else}新增供应商{/if}</h2>

{if $errors}
<div class="err">
  {foreach $errors as $msg}
    <div>{$msg}</div>
  {/foreach}
</div>
{/if}

<form method="post" action="{if $supplier}/supplier/update/{$supplier.id}{else}/supplier/store{/if}">
  <div class="field">
    <label>供应商名称 *</label>
    <input type="text" name="name" value="{$supplier.name}" placeholder="请输入供应商名称">
    <div class="msg">{$errors.name}</div>
  </div>
  <div class="field">
    <label>联系人</label>
    <input type="text" name="contact" value="{$supplier.contact}">
    <div class="msg">{$errors.contact}</div>
  </div>
  <div class="field">
    <label>联系电话</label>
    <input type="text" name="phone" value="{$supplier.phone}" placeholder="如 13800000000">
    <div class="msg">{$errors.phone}</div>
  </div>
  <div class="field">
    <label>地址</label>
    <input type="text" name="address" value="{$supplier.address}">
    <div class="msg">{$errors.address}</div>
  </div>
  <div class="field">
    <label>状态</label>
    <select name="status">
      <option value="1" {if $supplier.status == 1}selected{/if}>启用</option>
      <option value="0" {if $supplier.status == 0}selected{/if}>停用</option>
    </select>
  </div>
  <button class="btn" type="submit">保存</button>
  <a class="btn ghost" href="/supplier">返回列表</a>
</form>
{/block}
